<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Region Map</title>
<style>
  *, box-sizing: border-box;
  body { margin:0; background:#ddd; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; gap:12px; }

  /* ── toolbar ── */
  #toolbar { display:flex; align-items:center; gap:10px; background:white; padding:8px 14px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.2); font-size:13px; color:#444; flex-wrap:wrap; }
  #colorPicker { width:36px; height:28px; border:none; cursor:pointer; padding:0; border-radius:4px; }
  #info { color:#888; min-width:130px; }
  button { padding:4px 10px; border:1px solid #ccc; border-radius:5px; background:white; cursor:pointer; font-size:12px; }
  button:hover { background:#eee; }
  #swatches { display:flex; gap:4px; }
  .sw { width:22px; height:22px; border-radius:4px; cursor:pointer; border:2px solid transparent; }
  .sw:hover { border-color:#333; }

  /* ── main layout ── */
  #main { display:flex; gap:16px; align-items:flex-start; }

  /* ── map ── */
  svg { display:block; background:white; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.15); cursor:pointer; flex-shrink:0; }
  .region { transition:opacity .12s; }
  .region:hover { opacity:.8; }

  /* ── legend ── */
  #legend {
    background:white; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.15);
    padding:14px 16px; min-width:200px; max-width:240px;
  }
  #legend h3 {
    margin:0 0 12px; font-size:11px; color:#999; font-weight:700;
    text-transform:uppercase; letter-spacing:.08em;
  }
  #leg-empty {
    font-size:12px; color:#bbb; font-style:italic; text-align:center;
    padding:12px 0;
  }
  .leg-row {
    display:flex; align-items:center; gap:10px; margin-bottom:7px;
    padding:5px 7px; border-radius:6px; cursor:pointer;
  }
  .leg-row:hover  { background:#f5f5f5; }
  .leg-row.active { background:#eef3ff; }
  .leg-swatch {
    width:20px; height:20px; border-radius:4px; flex-shrink:0;
    border:1px solid rgba(0,0,0,.18);
  }
  .leg-name {
    font-size:13px; font-weight:500; color:#222; flex:1; min-width:0;
    border:none; outline:none; background:transparent;
    font-family:inherit; cursor:text;
  }
  .leg-name::placeholder { color:#aaa; font-weight:400; font-style:italic; }
  .leg-name:focus { background:#f7f9ff; border-radius:3px; padding:0 3px; }
  .leg-clear {
    font-size:11px; color:#ccc; cursor:pointer; flex-shrink:0;
    line-height:1; display:none;
  }
  .leg-row:hover .leg-clear { display:block; }
  .leg-clear:hover { color:#e74c3c; }

  #loading { color:#888; font-size:14px; padding:40px; }
</style>
</head>
<body>

<div id="toolbar">
  <label>Color:</label>
  <input type="color" id="colorPicker" value="#4a90d9">
  <div id="swatches">
    <div class="sw" style="background:#e74c3c" data-c="#e74c3c"></div>
    <div class="sw" style="background:#e67e22" data-c="#e67e22"></div>
    <div class="sw" style="background:#f1c40f" data-c="#f1c40f"></div>
    <div class="sw" style="background:#2ecc71" data-c="#2ecc71"></div>
    <div class="sw" style="background:#3498db" data-c="#3498db"></div>
    <div class="sw" style="background:#9b59b6" data-c="#9b59b6"></div>
    <div class="sw" style="background:#1abc9c" data-c="#1abc9c"></div>
    <div class="sw" style="background:#bdc3c7" data-c="#bdc3c7"></div>
  </div>
  <button id="clearBtn">Clear all</button>
  <span id="info">Loading…</span>
</div>

<div id="main">
  <div id="loading">Loading map…</div>

  <div id="legend">
    <h3>Legend</h3>
    <div id="leg-empty">Color a region to add it here</div>
  </div>
</div>

<script>
/*
  Strategy:
  1. Fetch 062-2.svg and extract base64 PNG href + bounding box for each raster0–8
  2. Build an SVG:
     - raster0 as the base map background (non-interactive)
     - raster1–8 as clickable region layers, each with an SVG filter
       that replaces pixel colors with the chosen color while preserving alpha
  3. Selection changes the filter's feFlood color

  Region mapping (dot inside bounding box):
    raster8: (122,31,195×212)  → Region 1  dot(243,140)
    raster7: (281,94, 89×122)  → Region 2  dot(309,166)
    raster6: (143,174,166×171) → Region 3  dot(190,241)
    raster5: (300,205,181×114) → Region 7  dot(318,227)
    raster4: (259,259,188×123) → Region 4  dot(285,305)
    raster2: (110,288,212×161) → Region 5  dot(248,395)
    raster3: (259,322,118×185) → Region 8  dot(333,373)
    raster1: (166,438,150×114) → Region 6  dot(266,499)
*/

// Region definitions — order = draw order (bottom to top)
// name is editable by user in the legend
const REGIONS = [
  { id:'raster8', name:'Region 1',  color:null },
  { id:'raster7', name:'Region 2',  color:null },
  { id:'raster6', name:'Region 3',  color:null },
  { id:'raster5', name:'Region 7',  color:null },
  { id:'raster4', name:'Region 4',  color:null },
  { id:'raster2', name:'Region 5',  color:null },
  { id:'raster3', name:'Region 8',  color:null },
  { id:'raster1', name:'Region 6',  color:null },
];

const SVG_NS = 'http://www.w3.org/2000/svg';
const picker  = document.getElementById('colorPicker');
const info    = document.getElementById('info');
const legend  = document.getElementById('legend');
let selected  = null;   // currently selected REGIONS[idx]

// ── Legend — only colored regions are shown ──────────────
function buildLegendRow(r, idx) {
  const row = document.createElement('div');
  row.className = 'leg-row';

  const swatch = document.createElement('div');
  swatch.className = 'leg-swatch';
  swatch.style.background = r.color;

  const nameInput = document.createElement('input');
  nameInput.className   = 'leg-name';
  nameInput.type        = 'text';
  nameInput.value       = r.faction || '';
  nameInput.placeholder = 'Enter faction name…';
  nameInput.addEventListener('input',  () => { r.faction = nameInput.value; });
  nameInput.addEventListener('click',  e  => e.stopPropagation());
  nameInput.addEventListener('keydown',e  => { if(e.key==='Enter') nameInput.blur(); });

  const clr = document.createElement('span');
  clr.className   = 'leg-clear';
  clr.textContent = '✕';
  clr.title = 'Remove';
  clr.addEventListener('click', e => { e.stopPropagation(); clearRegion(r, idx); });

  row.appendChild(swatch);
  row.appendChild(nameInput);
  row.appendChild(clr);
  row.addEventListener('click', () => selectRegion(r, idx));

  r.legRow    = row;
  r.legSwatch = swatch;
  r.nameInput = nameInput;
  return row;
}

function refreshLegend() {
  // Remove all existing rows
  document.querySelectorAll('.leg-row').forEach(el => el.remove());

  const colored = REGIONS.filter(r => r.color);
  const empty   = document.getElementById('leg-empty');

  if (colored.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    colored.forEach(r => {
      const idx = REGIONS.indexOf(r);
      const row = r.legRow || buildLegendRow(r, idx);
      // update swatch color in case it changed
      r.legSwatch.style.background = r.color;
      row.classList.toggle('active', r === selected);
      legend.appendChild(row);
    });
  }
}

function updateLegendRow(r) {
  if (r.legRow) {
    r.legSwatch.style.background = r.color || '';
    r.legRow.classList.toggle('active', r === selected);
  }
  refreshLegend();
  // sync active state across all rows
  REGIONS.forEach(rr => rr.legRow && rr.legRow.classList.toggle('active', rr === selected));
}

// ── Region interaction ────────────────────────────────────
function selectRegion(r, idx) {
  selected = r;
  applyColor(r, picker.value);
  info.textContent = r.name + ' selected';
  REGIONS.forEach((rr, ii) => {
    rr.legRow && rr.legRow.classList.toggle('active', rr === r);
  });
}

function clearRegion(r, idx) {
  r.color   = null;
  r.faction = '';
  r.legRow  = null;   // force rebuild next time
  r.floodEl.setAttribute('flood-color',   'transparent');
  r.floodEl.setAttribute('flood-opacity', '0');
  if (selected === r) { selected = null; info.textContent = 'Click a region'; }
  refreshLegend();
}

function applyColor(r, hex) {
  r.color = hex;
  const [rv, gv, bv] = [
    parseInt(hex.slice(1,3),16),
    parseInt(hex.slice(3,5),16),
    parseInt(hex.slice(5,7),16)
  ];
  r.floodEl.setAttribute('flood-color',   `rgb(${rv},${gv},${bv})`);
  r.floodEl.setAttribute('flood-opacity', '0.55');
  updateLegendRow(r);
}

// ── Main init ────────────────────────────────────────────
async function init() {
  const resp = await fetch('062-2.svg');
  const text = await resp.text();
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'image/svg+xml');

  const imgData = {};
  for (let i = 0; i <= 8; i++) {
    const el = doc.getElementById(`raster${i}`);
    if (!el) continue;
    imgData[`raster${i}`] = {
      href:   el.getAttribute('href') || el.getAttributeNS('http://www.w3.org/1999/xlink','href'),
      x:      +el.getAttribute('x'),
      y:      +el.getAttribute('y'),
      width:  +el.getAttribute('width'),
      height: +el.getAttribute('height'),
    };
  }

  // Build SVG
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width',  '580');
  svg.setAttribute('height', '580');
  svg.setAttribute('viewBox','0 0 580 580');

  const defs = document.createElementNS(SVG_NS, 'defs');

  REGIONS.forEach((r, idx) => {
    const fid = `cf${idx}`;
    const filter = document.createElementNS(SVG_NS, 'filter');
    filter.setAttribute('id', fid);
    filter.setAttribute('x', '0%'); filter.setAttribute('y', '0%');
    filter.setAttribute('width', '100%'); filter.setAttribute('height', '100%');
    filter.setAttribute('color-interpolation-filters', 'sRGB');

    const flood = document.createElementNS(SVG_NS, 'feFlood');
    flood.setAttribute('flood-color',   'transparent');
    flood.setAttribute('flood-opacity', '0');
    flood.setAttribute('result', 'flood');

    const comp = document.createElementNS(SVG_NS, 'feComposite');
    comp.setAttribute('in',  'flood');
    comp.setAttribute('in2', 'SourceAlpha');
    comp.setAttribute('operator', 'in');

    filter.appendChild(flood);
    filter.appendChild(comp);
    defs.appendChild(filter);
    r.filterId = fid;
    r.floodEl  = flood;
  });

  svg.appendChild(defs);

  // Base map
  const base = document.createElementNS(SVG_NS, 'image');
  const b = imgData['raster0'];
  base.setAttribute('x', b.x); base.setAttribute('y', b.y);
  base.setAttribute('width', b.width); base.setAttribute('height', b.height);
  base.setAttribute('href', b.href);
  base.style.pointerEvents = 'none';
  svg.appendChild(base);

  // Region layers
  REGIONS.forEach((r, idx) => {
    const d = imgData[r.id];
    if (!d) return;
    const img = document.createElementNS(SVG_NS, 'image');
    img.setAttribute('x',      d.x);
    img.setAttribute('y',      d.y);
    img.setAttribute('width',  d.width);
    img.setAttribute('height', d.height);
    img.setAttribute('href',   d.href);
    img.setAttribute('filter', `url(#${r.filterId})`);
    img.classList.add('region');
    img.addEventListener('click', () => selectRegion(r, idx));
    svg.appendChild(img);
    r.el = img;
  });

  document.getElementById('loading').remove();
  document.getElementById('main').insertBefore(svg, legend);
  info.textContent = 'Click a region';

  refreshLegend();

  // Toolbar events
  picker.addEventListener('input', () => {
    if (selected) applyColor(selected, picker.value);
  });

  document.querySelectorAll('.sw').forEach(sw => {
    sw.addEventListener('click', () => {
      picker.value = sw.dataset.c;
      if (selected) applyColor(selected, picker.value);
    });
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    REGIONS.forEach((r, idx) => clearRegion(r, idx));
    selected = null;
    info.textContent = 'Click a region';
  });
}

init().catch(e => { info.textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
